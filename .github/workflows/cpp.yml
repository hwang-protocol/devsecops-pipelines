# 可复用的 C++ DevSecOps 流水线 (reusable workflow)
#
# 各项目仓库这样调用 (固定到本仓库的某个 commit):
#   jobs:
#     devsecops:
#       uses: hwang-protocol/devsecops-pipelines/.github/workflows/cpp.yml@<SHA>
#       permissions: { contents: read, security-events: write, actions: read }
#       with:
#         apt-packages: libsqlite3-dev
#
# 对项目仓库的约定 (golden path):
#   - 根目录有 CMakeLists.txt，测试用 ctest 注册
#   - 可选: 根目录放 .gitleaks.toml / .semgrepignore 覆盖默认规则
#
# 公开仓库 vs 私有仓库 (扫描报告放哪里):
#   - 公开仓库: SARIF 上传到 GitHub 的 Code scanning (Security 页面能看到每条告警)
#   - 私有仓库: Code scanning 需要付费的 GitHub Advanced Security，上传会报
#     "Resource not accessible by integration"。所以私有仓库不上传，改为把 SARIF 存成
#     这次运行的产物 (Actions 页面 → 这次运行 → Artifacts 下载)，有问题照样让 CI 失败
#   - 判断条件: github.event.repository.private (被调用时，github 上下文是调用方仓库的)
#
#   secrets ─┐
#   sast ────┤ 并行
#   codeql ──┤
#   test ────┘ (release / ASan+UBSan / TSan 三种构建)
name: cpp-devsecops

on:
  workflow_call:
    inputs:
      apt-packages:
        description: 额外的 apt 包 (空格分隔)，例如 libsqlite3-dev
        type: string
        default: ''
      cmake-args:
        description: 额外的 cmake 配置参数
        type: string
        default: ''
      python:
        description: 仓库里有 Python 脚本时设为 true，CodeQL 和 Semgrep 会一起扫
        type: boolean
        default: false

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2
  SEMGREP_IMAGE: semgrep/semgrep:1.99.0
  CXX: clang++-18          # ubuntu-24.04 runner 自带

jobs:
  # ---------- 密钥泄露 ----------
  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0               # 扫完整 git 历史
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint sh "$GITLEAKS_IMAGE" -c \
            'git config --global --add safe.directory /repo &&
             gitleaks detect -s /repo --redact --no-banner \
               --report-format sarif --report-path /repo/gitleaks.sarif'
      # 公开仓库: 上传到 Code scanning
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        if: always() && !github.event.repository.private
        with: { sarif_file: gitleaks.sarif, category: gitleaks }
      # 私有仓库: 存成产物 (上一步有发现时 gitleaks 退出码非 0，job 已经失败；always() 保证报告照样保存)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event.repository.private
        with: { name: gitleaks-sarif, path: gitleaks.sarif, if-no-files-found: warn }

  # ---------- SAST: Semgrep (快) ----------
  sast:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: semgrep
        env:
          PY_RULES: ${{ inputs.python && '--config p/python' || '' }}
        run: |
          # shellcheck disable=SC2086  # PY_RULES 为空时要展开成 0 个参数
          docker run --rm -v "$PWD":/src -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/c --config p/github-actions $PY_RULES \
            --metrics=off --error --sarif --output semgrep.sarif
      # 公开仓库: 上传到 Code scanning
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        if: always() && !github.event.repository.private
        with: { sarif_file: semgrep.sarif, category: semgrep }
      # 私有仓库: 存成产物 (上一步有发现时 semgrep 退出码非 0，job 已经失败；always() 保证报告照样保存)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event.repository.private
        with: { name: semgrep-sarif, path: semgrep.sarif, if-no-files-found: warn }

  # ---------- SAST: CodeQL (数据流分析) ----------
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read            # codeql-action v4 会读取本次 workflow run 的信息；私有仓库必须显式授权
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.python && '["c-cpp","actions","python"]' || '["c-cpp","actions"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: install packages
        if: matrix.language == 'c-cpp' && inputs.apt-packages != ''
        env: { PKGS: '${{ inputs.apt-packages }}' }
        run: |
          sudo apt-get update -q
          # shellcheck disable=SC2086
          sudo apt-get install -y -q $PKGS
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'c-cpp' && 'manual' || 'none' }}
          queries: security-extended
      - name: build (C++ 需要真实编译)
        if: matrix.language == 'c-cpp'
        env: { CMAKE_ARGS: '${{ inputs.cmake-args }}' }
        run: |
          # shellcheck disable=SC2086
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug $CMAKE_ARGS
          cmake --build build -j
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: '/language:${{ matrix.language }}'
          # 私有仓库不上传 (见文件开头的说明)，SARIF 写到 codeql-results/ 目录
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event.repository.private
        with: { name: 'codeql-${{ matrix.language }}-sarif', path: codeql-results, if-no-files-found: warn }
      - name: '私有仓库: 有发现就让 CI 失败'
        # 公开仓库的发现在 Security 页面里分级处理 (告警，不挡合并)；
        # 私有仓库没有那个页面，CI 失败是唯一能让人看到问题的信号
        if: github.event.repository.private
        run: |
          # 每个 SARIF 文件: runs[].results[] 就是一条条发现；统计总数
          n=$(jq -s '[.[].runs[].results[]] | length' codeql-results/*.sarif)   # -s: 把所有文件读成一个数组
          echo "CodeQL findings: $n"
          if [ "$n" -gt 0 ]; then
            # 打印每条发现: 规则 id、文件:行号、说明，方便直接在日志里看
            jq -r '.runs[].results[] | "\(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  \(.message.text)"' codeql-results/*.sarif
            exit 1
          fi

  # ---------- 测试: 普通 / ASan+UBSan / TSan ----------
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address, thread]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: install packages
        # libclang-rt-18-dev: ASan/TSan 的运行时库，Ubuntu 默认不随 clang 安装
        env: { PKGS: '${{ inputs.apt-packages }}' }
        run: |
          sudo apt-get update -q
          # shellcheck disable=SC2086
          sudo apt-get install -y -q libclang-rt-18-dev $PKGS
          # llvm-symbolizer：sanitizer 报错时把地址翻译成 文件:行号
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: TSan 需要降低 ASLR 随机位数
        # Ubuntu 24.04 的内核默认 mmap_rnd_bits=32，clang-18 的 TSan 会报
        # "unexpected memory mapping" 直接退出
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: build & test
        env:
          SAN: ${{ matrix.sanitizer }}
          CMAKE_ARGS: ${{ inputs.cmake-args }}
        run: |
          case "$SAN" in
            address) FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" ;;
            thread)  FLAGS="-fsanitize=thread" ;;
            *)       FLAGS="" ;;
          esac
          # shellcheck disable=SC2086
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$FLAGS" \
            $CMAKE_ARGS
          cmake --build build -j
          ctest --test-dir build --output-on-failure
